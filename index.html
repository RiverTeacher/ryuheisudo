<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="keywords" content="須藤龍平, 須藤 龍平">
<meta name="author" content="須藤龍平">
<meta name="google-site-verification" content="u26voLDqtXNVUxhyeHSJq0uz7MsFmRnied1q09tnBaA" />
<title>須藤龍平</title>
<script src="common.js"></script>
<link rel="canonical" href="https://riverteacher.github.io/ryuheisudo/">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-jp@latest/japanese-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-jp@latest/japanese-300-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/share-tech-mono@latest/latin-400-normal.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    color: #3a4a5c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    background: linear-gradient(
      120deg,
      #ffffff 0%,
      #eaf6fc 20%,
      #ffffff 40%,
      #e3f2fa 60%,
      #ffffff 80%,
      #eef8fd 100%
    );
    background-size: 300% 300%;
    animation: gradientFlow 22s ease-in-out infinite;
  }

  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body.rainbow-day {
    background: linear-gradient(
      120deg,
      #ffd9e3 0%,
      #ffedc8 20%,
      #d8f5d0 40%,
      #cdeffd 60%,
      #e2d9fa 80%,
      #ffd9e3 100%
    );
    background-size: 400% 400%;
    animation: rainbowFlow 14s ease-in-out infinite;
  }

  @keyframes rainbowFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 45vmax;
    height: 45vmax;
    top: -12vmax;
    left: -10vmax;
    background: radial-gradient(circle, rgba(150, 210, 240, 0.35) 0%, transparent 70%);
    animation: floatA 16s ease-in-out infinite;
  }

  body::after {
    width: 50vmax;
    height: 50vmax;
    bottom: -15vmax;
    right: -12vmax;
    background: radial-gradient(circle, rgba(120, 200, 235, 0.28) 0%, transparent 70%);
    animation: floatB 20s ease-in-out infinite;
  }

  @keyframes floatA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(8vmax, 5vmax) scale(1.15); }
  }

  @keyframes floatB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-6vmax, -4vmax) scale(1.1); }
  }

  @keyframes hueSpin {
    from { filter: blur(80px) hue-rotate(0deg); }
    to   { filter: blur(80px) hue-rotate(360deg); }
  }

  body.rainbow-day::before {
    animation: floatA 16s ease-in-out infinite, hueSpin 9s linear infinite;
  }

  body.rainbow-day::after {
    animation: floatB 20s ease-in-out infinite, hueSpin 9s linear infinite;
  }

  .countdown {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(0.4rem, 2vw, 1.6rem);
    padding-top: 14vh;
    pointer-events: none;
    opacity: 0.10;
    color: #4d9cc4;
    font-family: 'Share Tech Mono', monospace;
    user-select: none;
  }

  .cd-segment {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }

  .cd-num {
    font-size: clamp(2.4rem, 11vw, 9rem);
    line-height: 1;
  }

  .cd-label {
    font-size: clamp(0.55rem, 1.3vw, 0.85rem);
    letter-spacing: 0.4em;
    padding-left: 0.4em;
  }

  .cd-colon {
    font-size: clamp(2.4rem, 11vw, 9rem);
    line-height: 1;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  body.rainbow-day .countdown {
    color: #8a6bb0;
  }

  /* 3D Ring Stage */
  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px; /* JSが枚数に応じて上書きします */
    touch-action: pan-y;
    user-select: none;
  }

  .ring {
    position: relative;
    width: 300px;
    height: 200px;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .panel {
    position: absolute;
    width: 300px;
    height: 200px;
    left: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(0, 200, 255, 0.35);
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.5) inset,
      0 8px 32px rgba(0, 160, 220, 0.12),
      0 0 24px rgba(0, 200, 255, 0.08);
    text-decoration: none;
    color: #2a5a70;
    transition: background 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                color 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
    overflow: hidden;
    /* transform（配置）はJSが設定します */
  }

  /* 走る光 */
  .panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(0, 220, 255, 0.12),
      transparent
    );
    transform: skewX(-20deg);
    transition: left 0.8s ease;
    pointer-events: none;
  }

  .panel:hover::before {
    left: 150%;
  }

  .panel:hover {
    background: rgba(255, 255, 255, 0.75);
    border-color: rgba(0, 200, 255, 0.75);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.7) inset,
      0 14px 48px rgba(0, 160, 220, 0.22),
      0 0 36px rgba(0, 220, 255, 0.18);
    color: #1a4a60;
  }

  .panel-category {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.35em;
    color: rgba(0, 160, 200, 0.75);
    margin-bottom: 16px;
    text-transform: uppercase;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  .panel:hover .panel-category {
    color: rgba(0, 180, 220, 1);
    text-shadow: 0 0 12px rgba(0, 200, 255, 0.45);
  }

  .panel-title {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: #3a5a6c;
    padding: 0 12px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  .panel:hover .panel-title {
    color: #0d3a4e;
    text-shadow: 0 0 18px rgba(0, 200, 255, 0.35), 0 0 36px rgba(0, 180, 230, 0.12);
  }

  /* パネル下部のネオンライン */
  .panel::after {
    content: '';
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 32px;
    height: 1.5px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(0, 200, 255, 0.55) 40%,
      rgba(0, 180, 230, 0.75) 70%,
      transparent 100%
    );
    border-radius: 2px;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 8px rgba(0, 200, 255, 0.35);
  }

  .panel:hover::after {
    transform: scaleX(1);
  }

  /* コーナーブラケット */
  .panel .bracket {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1.5px solid rgba(0, 200, 255, 0.3);
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
    pointer-events: none;
  }

  .panel .bracket-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .panel .bracket-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .panel .bracket-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .panel .bracket-br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .panel:hover .bracket {
    border-color: rgba(0, 200, 255, 0.7);
    box-shadow: 0 0 6px rgba(0, 200, 255, 0.25);
  }

  h1 {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.4em;
    color: rgba(80, 150, 190, 0.85);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 3;
  }

  .hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(80, 160, 200, 0.55);
    pointer-events: none;
    z-index: 3;
  }

  @media (prefers-reduced-motion: reduce) {
    body,
    body::before,
    body::after,
    .cd-colon {
      animation: none;
    }
  }

  @media (max-width: 640px) {
    .stage {
      height: 400px;
    }
    .ring {
      width: 210px;
      height: 140px;
    }
    .panel {
      width: 210px;
      height: 140px;
    }
    .panel-title {
      font-size: 18px;
    }
  }
</style>
</head>
<body>
  <div class="countdown" aria-hidden="true">
    <div class="cd-segment">
      <span class="cd-num" id="cd-days">--</span>
      <span class="cd-label">DAYS</span>
    </div>
    <span class="cd-colon">:</span>
    <div class="cd-segment">
      <span class="cd-num" id="cd-hours">--</span>
      <span class="cd-label">HOURS</span>
    </div>
    <span class="cd-colon">:</span>
    <div class="cd-segment">
      <span class="cd-num" id="cd-mins">--</span>
      <span class="cd-label">MINS</span>
    </div>
    <span class="cd-colon">:</span>
    <div class="cd-segment">
      <span class="cd-num" id="cd-secs">--</span>
      <span class="cd-label">SECS</span>
    </div>
  </div>

  <main class="stage" id="stage">
    <h1>Home</h1>
    <!-- パネルを増やしたいときは、下に <a class="panel"> をコピーして追加するだけでOK -->
    <div class="ring" id="ring">
      <a href="contact.html" class="panel">
        <span class="bracket bracket-tl"></span>
        <span class="bracket bracket-tr"></span>
        <span class="bracket bracket-bl"></span>
        <span class="bracket bracket-br"></span>
        <span class="panel-category">一般</span>
        <span class="panel-title">連絡先</span>
      </a>
      <a href="wallet.html" class="panel">
        <span class="bracket bracket-tl"></span>
        <span class="bracket bracket-tr"></span>
        <span class="bracket bracket-bl"></span>
        <span class="bracket bracket-br"></span>
        <span class="panel-category">一般</span>
        <span class="panel-title">ウォレットアドレス</span>
      </a>
      <a href="announce.html" class="panel">
        <span class="bracket bracket-tl"></span>
        <span class="bracket bracket-tr"></span>
        <span class="bracket bracket-bl"></span>
        <span class="bracket bracket-br"></span>
        <span class="panel-category">一般</span>
        <span class="panel-title">おしらせ</span>
      </a>
      <a href="injury.html" class="panel">
        <span class="bracket bracket-tl"></span>
        <span class="bracket bracket-tr"></span>
        <span class="bracket bracket-bl"></span>
        <span class="bracket bracket-br"></span>
        <span class="panel-category">ネタ</span>
        <span class="panel-title">ケガ</span>
      </a>
    </div>
    <span class="hint">くるくるできます</span>
  </main>

  <script>
    // Countdown
    const elDays  = document.getElementById('cd-days');
    const elHours = document.getElementById('cd-hours');
    const elMins  = document.getElementById('cd-mins');
    const elSecs  = document.getElementById('cd-secs');

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tick() {
      const now = new Date();
      let year = now.getFullYear();
      let target = new Date(year, 11, 15, 0, 0, 0);
      const endOfDay = new Date(year, 11, 15, 23, 59, 59, 999);

      const isRainbowDay = now >= target && now <= endOfDay;
      document.body.classList.toggle('rainbow-day', isRainbowDay);

      if (now > endOfDay) {
        target = new Date(year + 1, 11, 15, 0, 0, 0);
      }

      const diff = Math.max(0, target - now);
      const d = Math.floor(diff / 86400000);
      const h = Math.floor(diff / 3600000) % 24;
      const m = Math.floor(diff / 60000) % 60;
      const s = Math.floor(diff / 1000) % 60;

      elDays.textContent  = pad(d);
      elHours.textContent = pad(h);
      elMins.textContent  = pad(m);
      elSecs.textContent  = pad(s);
    }

    tick();
    setInterval(tick, 1000);

    // 3D Ring
    const stage = document.getElementById('stage');
    const ring = document.getElementById('ring');
    const panels = ring.querySelectorAll('.panel');

    let rotation = 0;
    let velocity = 0.25;
    let isTouching = false;
    let isHovering = false;
    let lastTouchX = 0;
    let lastTouchTime = 0;
    let touchMoved = false;
    let ringRadius = 380;

    // パネル枚数・画面幅に応じて、角度と半径を自動計算して配置する
    function layoutRing() {
      const count = panels.length;
      if (count === 0) return;

      const panelWidth = panels[0].offsetWidth;
      const step = 360 / count;

      // 隣同士が重ならない半径（パネル幅の1.3倍ぶんの間隔を確保）
      const pitch = panelWidth * 1.3;
      const neededRadius = count > 1 ? (pitch / 2) / Math.tan(Math.PI / count) : 0;

      // 少ない枚数でも元のゆったりした見た目を保つための最小半径
      const minRadius = panelWidth * 1.25;

      ringRadius = Math.max(minRadius, neededRadius);

      panels.forEach(function(panel, i) {
        panel.style.transform = 'rotateY(' + (step * i) + 'deg) translateZ(' + ringRadius + 'px)';
      });

      // 半径に比例して遠近感も調整（枚数が増えても歪みすぎない）
      stage.style.perspective = Math.max(900, ringRadius * 3.5) + 'px';

      applyRotation();
    }

    // 手前のパネルが常に等倍になるよう、リング全体を奥へ下げて回転させる
    function applyRotation() {
      ring.style.transform = 'translateZ(' + (-ringRadius) + 'px) rotateY(' + rotation + 'deg)';
    }

    function animate() {
      if (!isTouching) {
        if (isHovering) {
          velocity *= 0.88;
          if (Math.abs(velocity) < 0.015) velocity = 0;
        } else {
          velocity += (0.25 - velocity) * 0.025;
        }
      }

      rotation += velocity;
      applyRotation();
      requestAnimationFrame(animate);
    }

    layoutRing();
    window.addEventListener('resize', layoutRing);
    requestAnimationFrame(animate);

    // Touch swipe to spin
    ring.addEventListener('touchstart', function(e) {
      isTouching = true;
      lastTouchX = e.touches[0].clientX;
      lastTouchTime = Date.now();
      touchMoved = false;
    }, { passive: true });

    ring.addEventListener('touchmove', function(e) {
      if (!isTouching) return;
      const x = e.touches[0].clientX;
      const now = Date.now();
      const dt = now - lastTouchTime;
      const dx = x - lastTouchX;

      if (dt > 0) {
        velocity = (dx / dt) * 6;
      }

      rotation += dx * 0.35;
      applyRotation();

      lastTouchX = x;
      lastTouchTime = now;
      touchMoved = true;
    }, { passive: true });

    ring.addEventListener('touchend', function() {
      isTouching = false;
    });

    // Prevent link click on swipe
    panels.forEach(function(panel) {
      panel.addEventListener('click', function(e) {
        if (touchMoved) {
          e.preventDefault();
        }
      });
    });

    // Mouse hover pause
    ring.addEventListener('mouseenter', function() {
      isHovering = true;
    });

    ring.addEventListener('mouseleave', function() {
      isHovering = false;
    });
  </script>
</body>
</html>
