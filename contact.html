<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- キャッシュ禁止 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- インデックス禁止 -->
    <meta name="robots" content="noindex, nofollow">
    
    <title>連絡先 | 須藤龍平</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (アイコン用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 指定の外部スクリプトファイル -->
    <script src="common.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50/30 to-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8 selection:bg-sky-500 selection:text-white">

    <div class="max-w-2xl mx-auto w-full pt-6 pb-12">
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 mb-4 shadow-lg shadow-sky-500/20">
                <i class="fa-regular fa-paper-plane text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 mb-2">Contact</h1>
            <p class="text-slate-600 text-sm sm:text-base">ご連絡・お問い合わせはこちらのフォームまたは各種リンクよりお願いいたします。</p>
        </header>

        <main class="space-y-4">
            
            <!-- Email Card & Trigger (1番上に配置) -->
            <div class="bg-white/90 border border-slate-200/80 rounded-2xl p-5 backdrop-blur-sm shadow-sm hover:shadow-md hover:border-slate-300 transition-all-300">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-sky-500 flex items-center justify-center text-white text-xl shrink-0 shadow-md shadow-sky-500/20">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <div class="overflow-hidden">
                            <h2 class="font-semibold text-slate-900 text-base">Email</h2>
                            <p class="text-slate-500 text-xs truncate">ryuhei@svk.jp</p>
                        </div>
                    </div>
                    <button id="toggleFormBtn" onclick="toggleMailForm()" 
                            class="w-full sm:w-auto px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-medium text-sm rounded-xl transition-all-300 shadow-md shadow-sky-600/10 active:scale-95 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span id="btnText">メールを送る</span>
                    </button>
                </div>

                <div id="emailFormContainer" class="hidden mt-6 pt-6 border-t border-slate-200">
                    <form id="contactForm" onsubmit="handleMailSubmit(event)" class="space-y-4">
                        <div>
                            <label for="subject" class="block text-xs font-medium text-slate-700 mb-1.5">
                                件名 <span class="text-slate-400">(任意)</span>
                            </label>
                            <input type="text" id="subject" placeholder="お問い合わせ件名" 
                                   class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all-300">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label for="message" class="block text-xs font-medium text-slate-700">
                                    ご要件 <span class="text-rose-500">*</span>
                                </label>
                                <span id="charCounter" class="text-xs text-rose-500 font-mono">0 / 20文字以上</span>
                            </div>
                            <textarea id="message" rows="5" required minlength="20" placeholder="お問い合わせ内容をご記入ください (20文字以上)"
                                      oninput="updateCharCount()"
                                      class="w-full bg-slate-50 border border-slate-300 rounded-xl p-4 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all-300 resize-y"></textarea>
                            <p id="errorMsg" class="text-xs text-rose-500 mt-1 hidden">※ 送信には20文字以上の入力が必要です。</p>
                        </div>

                        <!-- User Agent Preview Box -->
                        <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs text-slate-600 space-y-1">
                            <div class="flex items-center gap-1.5 text-slate-700 font-medium">
                                <i class="fa-solid fa-circle-info text-sky-600"></i>
                                <span>自動付加される送信環境情報</span>
                            </div>
                            <p class="text-[11px] leading-relaxed text-slate-500 break-all" id="uaPreview">
                                読み込み中...
                            </p>
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="submitBtn" disabled
                                    class="w-full py-3 bg-slate-200 text-slate-400 font-semibold text-sm rounded-xl cursor-not-allowed transition-all-300 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>メールを送信する</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Instagram Card -->
            <div class="bg-white/90 border border-slate-200/80 rounded-2xl p-5 backdrop-blur-sm shadow-sm hover:shadow-md hover:border-slate-300 transition-all-300 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 flex items-center justify-center text-white text-2xl shrink-0 shadow-md shadow-rose-500/20">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h2 class="font-semibold text-slate-900 text-base">Instagram</h2>
                        <p class="text-slate-500 text-xs truncate max-w-[200px] sm:max-w-[280px]">頻繁に投稿しないです</p>
                    </div>
                </div>
                <button onclick="redirectUrl('https://www.instagram.com/ryuhei231815.dousabo?stkn=MWd4dmNxZGJ0cjRkeQ==')" 
                        class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-rose-500 to-purple-600 hover:from-rose-600 hover:to-purple-700 text-white font-medium text-sm rounded-xl transition-all-300 shadow-md shadow-rose-500/15 active:scale-95 flex items-center justify-center gap-2">
                    <span>開く</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </button>
            </div>

            <!-- SimpleX Card -->
            <div class="bg-white/90 border border-slate-200/80 rounded-2xl p-5 backdrop-blur-sm shadow-sm hover:shadow-md hover:border-slate-300 transition-all-300 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xl shrink-0 shadow-md shadow-emerald-600/20">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h2 class="font-semibold text-slate-900 text-base">SimpleX Chat</h2>
                        <p class="text-slate-500 text-xs truncate max-w-[200px] sm:max-w-[280px]">エンドツーエンド暗号化チャット</p>
                    </div>
                </div>
                <button onclick="redirectUrl('https://smp19.simplex.im/a#PiBQhYmkV0wH33kdzEZru5F8mQMC_9O-eSJJRMVlGmc')" 
                        class="w-full sm:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl transition-all-300 shadow-md shadow-emerald-600/15 active:scale-95 flex items-center justify-center gap-2">
                    <span>開く</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </button>
            </div>

        </main>

        <footer class="mt-12 text-center text-xs text-slate-400">
            &copy; Contact Form. All rights reserved.
        </footer>
    </div>

    <script>
        // リダイレクト処理関数
        function redirectUrl(url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        // メールフォームの開閉切り替え
        function toggleMailForm() {
            const container = document.getElementById('emailFormContainer');
            const btnText = document.getElementById('btnText');
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btnText.textContent = 'フォームを閉じる';
            } else {
                container.classList.add('hidden');
                btnText.textContent = 'メールを送る';
            }
        }

        // ユーザーエージェント情報の取得と整形
        function getUserAgentInfo() {
            const ua = navigator.userAgent;
            const lang = navigator.language || navigator.userLanguage || '不明';
            const platform = navigator.platform || '不明';
            const screenRes = `${window.screen.width}x${window.screen.height}`;

            return `User-Agent: ${ua}\nLanguage: ${lang}\nPlatform: ${platform}\nScreen Resolution: ${screenRes}`;
        }

        // 文字数カウント & 送信ボタン有効化ロジック
        function updateCharCount() {
            const messageInput = document.getElementById('message');
            const charCounter = document.getElementById('charCounter');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            const count = messageInput.value.length;

            if (count >= 20) {
                charCounter.textContent = `${count} 文字 (OK)`;
                charCounter.classList.remove('text-rose-500');
                charCounter.classList.add('text-emerald-600');
                errorMsg.classList.add('hidden');

                // 送信ボタン有効化
                submitBtn.disabled = false;
                submitBtn.className = "w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm rounded-xl cursor-pointer transition-all-300 flex items-center justify-center gap-2 shadow-lg shadow-sky-600/20 active:scale-98";
            } else {
                charCounter.textContent = `${count} / 20文字以上`;
                charCounter.classList.remove('text-emerald-600');
                charCounter.classList.add('text-rose-500');

                // 送信ボタン無効化
                submitBtn.disabled = true;
                submitBtn.className = "w-full py-3 bg-slate-200 text-slate-400 font-semibold text-sm rounded-xl cursor-not-allowed transition-all-300 flex items-center justify-center gap-2";
            }
        }

        // メール送信（toMail / mailtoプロトコルの呼び出し）
        function handleMailSubmit(e) {
            e.preventDefault();
            
            const toMail = "ryuhei@svk.jp";
            const subjectInput = document.getElementById('subject').value.trim();
            const messageInput = document.getElementById('message').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (messageInput.length < 20) {
                errorMsg.classList.remove('hidden');
                return;
            }

            // 件名の作成
            const subject = subjectInput ? `【お問い合わせ】${subjectInput}` : "【お問い合わせ】Webサイトからのご連絡";

            // 本文作成（要件 + ユーザーエージェント情報）
            const uaInfo = getUserAgentInfo();
            const fullBody = `${messageInput}\n\n-------------------\n[送信環境情報]\n${uaInfo}`;

            // mailto URI スキームの生成
            const mailtoUrl = `mailto:${toMail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(fullBody)}`;

            // メーラーを起動
            window.location.href = mailtoUrl;
        }

        // 初期化処理
        window.onload = function() {
            // UAプレビュー表示の設定
            const uaPreview = document.getElementById('uaPreview');
            if (uaPreview) {
                uaPreview.textContent = getUserAgentInfo().replace(/\n/g, ' | ');
            }
        };
    </script>
</body>
</html>
