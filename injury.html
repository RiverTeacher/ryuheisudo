<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <script src="common.js"></script>
<title>ケガ</title>
<style>
:root{
  --lv0:#8bc34a;   /* 黄緑（正常） */
  --lv1:#f2b705;   /* 黄（軽傷） */
  --lv2:#f57c00;   /* 橙（中傷） */
  --lv3:#e53935;   /* 赤（重症） */
  --inf:#8e24aa;   /* 紫（感染症） */
  --text:#2c3a42;
  --muted:#8fa1ab;
  --line:#e3ebf0;
  --card:#ffffff;
  --bg:#f4f8fa;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"SFMono-Regular",Menlo,Consolas,"Yu Gothic UI","Yu Gothic",monospace;
  display:flex;justify-content:center;
  padding:28px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:880px;}

header{text-align:center;margin-bottom:24px;}
h1{
  margin:0;
  font-size:clamp(20px,4vw,28px);
  letter-spacing:.2em;
  color:#2c3a42;
  font-weight:600;
}
.sub{margin:8px 0 0;font-size:11px;letter-spacing:.3em;color:#9db0ba;}

.board{
  display:grid;
  grid-template-columns:minmax(230px,300px) 1fr;
  gap:20px;
  align-items:start;
}
@media (max-width:640px){
  .board{grid-template-columns:1fr;}
}
.side{display:flex;flex-direction:column;gap:16px;min-width:0;}

/* ---------- ピクトグラム ---------- */
.figure{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}
.pictogram{
  width:100%;
  max-width:270px;
  height:auto;
  display:block;
  margin:0 auto;
  overflow:visible;
}
[data-part]{
  transition:color .35s ease;
}
[data-part].lv1{filter:drop-shadow(0 0 4px var(--lv1));}
[data-part].lv2{filter:drop-shadow(0 0 6px var(--lv2));}
[data-part].lv3{
  filter:drop-shadow(0 0 9px var(--lv3));
  animation:blink .9s steps(1,end) infinite;
}
@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:.28;}
}

/* 部位の塗り・境界線 */
.shape{
  fill:currentColor;
  stroke:#fff;
  stroke-width:1.8;
  stroke-linejoin:round;
}
.fixed{
  fill:#dde5ea;
  stroke:#fff;
  stroke-width:1.8;
  stroke-linejoin:round;
}
.joint{
  fill:none;
  stroke:#fff;
  stroke-width:1.6;
  stroke-linecap:round;
}
.finger{
  fill:none;
  stroke:#fff;
  stroke-width:1.3;
  stroke-linecap:round;
}
.gloss{
  fill:#fff;
  opacity:.28;
  stroke:none;
}
.ground{fill:#eef2f5;}

.legend{
  list-style:none;
  display:flex;flex-wrap:wrap;gap:8px 16px;
  justify-content:center;
  padding:0;margin:18px 0 0;
  font-size:11px;color:var(--muted);
}
.legend li{display:flex;align-items:center;gap:6px;}
.legend i{
  width:10px;height:10px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 6px var(--c);
}

/* ---------- パネル ---------- */
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:11px;letter-spacing:.2em;color:var(--muted);
  padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px dashed var(--line);
}

/* 感染症 */
.inf-item{
  border:1px solid var(--line);
  border-left:3px solid var(--inf);
  border-radius:9px;
  padding:12px 14px;
  margin-bottom:10px;
  background:#fff;
}
.inf-item:last-child{margin-bottom:0;}
.inf-head{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12px;
}
.inf-head strong{color:#22313a;font-size:13px;letter-spacing:.1em;}
.inf-badge{
  display:inline-block;
  font-size:10px;line-height:1;
  padding:4px 7px;
  border-radius:999px;
  border:1px solid var(--inf);
  color:var(--inf);
  white-space:nowrap;
}
.inf-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--inf);
  box-shadow:0 0 8px var(--inf);
  animation:blink 1.2s infinite;
}
.inf-meta{
  margin:8px 0 0;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.inf-comment{
  margin:8px 0 0;
  font-size:12px;line-height:1.7;color:#4a5c66;
}
.inf-empty{
  margin:0;
  font-size:12px;color:#8fa1ab;
  display:flex;align-items:center;gap:8px;
}
.inf-empty i{
  width:8px;height:8px;border-radius:50%;
  background:var(--lv0);
  box-shadow:0 0 6px var(--lv0);
}

/* アクティブ負傷 */
.alert{
  border:1px solid var(--line);
  border-left:3px solid var(--c);
  border-radius:9px;
  padding:12px 14px;
  margin-bottom:10px;
  background:#fff;
}
.alert-head{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12px;
}
.alert-head strong{color:#22313a;font-size:13px;letter-spacing:.12em;}
.alert-heal{
  margin-left:auto;
  font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.blink{
  width:8px;height:8px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 8px var(--c);
  animation:blink 1s infinite;
}
.alert-comment{
  margin:8px 0 0;
  font-size:12px;line-height:1.7;color:#4a5c66;
}

/* 部位リスト */
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.part{
  display:grid;
  grid-template-columns:10px 58px 54px 1fr;
  gap:10px 12px;
  align-items:center;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  font-size:12px;
}
.part.is-normal{opacity:.75;}
.dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 6px var(--c);
}
.pname{letter-spacing:.08em;color:#2c3a42;}
.badge{
  display:inline-block;
  font-size:10px;line-height:1;
  padding:4px 7px;
  border-radius:999px;
  border:1px solid var(--c);
  color:var(--c);
  white-space:nowrap;
  text-align:center;
}
.heal{display:flex;align-items:center;gap:8px;min-width:0;}
.heal-bar{
  flex:1;height:6px;border-radius:3px;background:#eef2f5;overflow:hidden;
}
.heal-bar i{
  display:block;height:100%;border-radius:3px;
  background:var(--c);
}
.heal-val{
  font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.heal-none{color:#c3ced6;font-size:11px;}
.part .cmt{
  grid-column:2 / -1;
  margin:0;
  font-size:11.5px;
  line-height:1.6;
  color:#5d707a;
}

@media (max-width:520px){
  .part{grid-template-columns:10px 52px 50px 1fr;gap:8px;}
}

footer{
  margin-top:22px;text-align:center;
  font-size:10px;letter-spacing:.12em;color:#b3c2cb;
}
</style>
</head>

       name   : 感染症名
       period : 〜迄（この時刻を過ぎると自動で非表示。nullで期限未定）
       comment: 任意（空でも可）
     ============================================================ -->

<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("injury-data").textContent);

  var COLORS = { 0: "var(--lv0)", 1: "var(--lv1)", 2: "var(--lv2)", 3: "var(--lv3)" };
  var LABELS = { 0: "正常", 1: "軽症", 2: "中等症", 3: "重症" };

  var partNames = Object.keys(DATA.parts || {});
  var infections = Array.isArray(DATA.infections) ? DATA.infections : [];

  /* ---------- utils ---------- */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function fmtDate(d) {
    return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) +
           " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function fmtRemain(ms) {
    var m = Math.floor(ms / 60000);
    var d = Math.floor(m / 1440);
    var h = Math.floor((m % 1440) / 60);
    var mm = m % 60;
    if (d > 0) return "残り " + d + "日" + h + "時間";
    if (h > 0) return "残り " + h + "時間" + mm + "分";
    return "残り " + mm + "分";
  }

  function endDate(part) {
    if (!part || !part.period) return null;
    var d = new Date(part.period);
    return isNaN(d.getTime()) ? null : d;
  }

  function isActive(part) {
    var e = endDate(part);
    return e === null ? true : Date.now() <= e.getTime();
  }

  function effLevel(part) {
    if (!part) return 0;
    var lv = Number(part.level) || 0;
    lv = Math.max(0, Math.min(3, lv));
    if (lv <= 0) return 0;
    return isActive(part) ? lv : 0;
  }

  /* ---------- 完治度 ----------
     残り時間ベースの指数。
       残り 0h   → 100%
       残り 24h  → 50%
       残り 72h  → 25%
       残り 168h → 12.5%
     式: 100 × 24 / (24 + 残り時間[h])
     期限内は最大 99.9% に丸める。
  --------------------------------- */
  function recovery(part) {
    var e = endDate(part);
    if (!e) return null;                     // 期限なし＝算出不可
    var remain = e.getTime() - Date.now();
    if (remain <= 0) return 100;             // 期限到達
    var h = remain / 3600000;
    return Math.min(99.9, (100 * 24) / (24 + h));
  }

  /* ---------- render ---------- */

  function renderInfections() {
    var box = document.getElementById("infBox");

    /* 期限内（または期限未定）のものだけ表示 */
    var actives = infections.filter(function (inf) {
      return inf && inf.name && isActive(inf);
    });

    if (!actives.length) {
      box.innerHTML = '<p class="inf-empty"><i></i>現在、感染症はありません</p>';
      return;
    }

    box.innerHTML = actives.map(function (inf) {
      var e = endDate(inf);
      var until = e ? "外出制限解除:  " + fmtDate(e) + "" : "期限未定";
      var remain = e ? fmtRemain(e.getTime() - Date.now()) : "";
      var cmt = inf.comment ? '<p class="inf-comment">' + escapeHtml(inf.comment) + "</p>" : "";

      return '' +
        '<div class="inf-item">' +
          '<div class="inf-head">' +
            '<span class="inf-dot"></span>' +
            "<strong>" + escapeHtml(inf.name) + "</strong>" +
            '<span class="inf-badge">感染中</span>' +
          "</div>" +
          '<p class="inf-meta"><span>' + until + "</span><span>" + remain + "</span></p>" +
          cmt +
        "</div>";
    }).join("");
  }

  function render() {

    /* 0. 感染症 */
    renderInfections();

    /* 1. ピクトグラム */
    document.querySelectorAll("[data-part]").forEach(function (g) {
      var part = DATA.parts[g.dataset.part];
      var lv = effLevel(part);
      g.style.color = COLORS[lv];
      g.classList.toggle("lv1", lv === 1);
      g.classList.toggle("lv2", lv === 2);
      g.classList.toggle("lv3", lv === 3);
    });

    /* 2. 部位リスト */
    var list = document.getElementById("partList");
    list.innerHTML = partNames.map(function (name) {
      var part = DATA.parts[name] || {};
      var raw = Number(part.level) || 0;
      var lv = effLevel(part);
      var expired = raw > 0 && !isActive(part);

      /* 完治度セル */
      var healHtml;
      if (raw <= 0) {
        healHtml = '<span class="heal"><span class="heal-none">—</span></span>';
      } else if (expired) {
        healHtml =
          '<span class="heal">' +
            '<span class="heal-bar"><i style="width:100%"></i></span>' +
            '<span class="heal-val">100%</span>' +
          '</span>';
      } else {
        var r = recovery(part);
        if (r === null) {
          healHtml = '<span class="heal"><span class="heal-none">—</span></span>';
        } else {
          healHtml =
            '<span class="heal">' +
              '<span class="heal-bar"><i style="width:' + r.toFixed(1) + '%"></i></span>' +
              '<span class="heal-val">' + r.toFixed(1) + '%</span>' +
            '</span>';
        }
      }

      /* コメント（期限内かつ level 1以上のみ） */
      var comment = (lv >= 1 && part.comment) ? escapeHtml(part.comment) : "";
      var cmtHtml = comment ? '<p class="cmt">' + comment + "</p>" : "";

      return '' +
        '<li class="part' + (lv === 0 ? " is-normal" : "") + '" style="--c:' + COLORS[lv] + '">' +
          '<span class="dot"></span>' +
          '<span class="pname">' + escapeHtml(name) + "</span>" +
          '<span class="badge">' + LABELS[lv] + "</span>" +
          healHtml +
          cmtHtml +
        "</li>";
    }).join("");

    /* 3. アクティブ負傷のハイライト */
    var actives = partNames.filter(function (name) {
      var p = DATA.parts[name] || {};
      return effLevel(p) >= 1 && p.comment;
    });

    var box = document.getElementById("alertBox");
    if (actives.length) {
      box.hidden = false;
      box.innerHTML = actives.map(function (name) {
        var p = DATA.parts[name];
        var lv = effLevel(p);
        var r = recovery(p);
        var rTxt = (r === null)
          ? ""
          : '<span class="alert-heal">完治度 ' + r.toFixed(1) + "%</span>";

        return '' +
          '<div class="alert" style="--c:' + COLORS[lv] + '">' +
            '<div class="alert-head">' +
              '<span class="blink"></span>' +
              "<strong>" + escapeHtml(name) + "</strong>" +
              '<span class="badge">' + LABELS[lv] + "</span>" +
              rTxt +
            "</div>" +
            '<p class="alert-comment">' + escapeHtml(p.comment) + "</p>" +
          "</div>";
      }).join("");
    } else {
      box.hidden = true;
      box.innerHTML = "";
    }
  }

  render();
  /* 完治度を動的に更新（1秒ごと） */
  setInterval(render, 1000);
})();
</script>

</body>
</html>
